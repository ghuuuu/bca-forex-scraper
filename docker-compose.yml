# Two containers off one image: one scrapes, one serves the chart it writes.
#
# Splitting them keeps the scraper single-purpose — if the web server falls over
# nothing stops being recorded, and the history is the part that cannot be
# reconstructed after the fact.
#
# On DSM: Container Manager -> Project -> Create -> upload this file.
#
# ./data and ./web must EXIST before this runs. Docker on Synology will not
# create a missing bind-mount source the way it does on Linux — it refuses to
# start the container instead:
#
#     Bind mount failed: '/volume1/docker/...' does not exists
#
# Both ship as empty folders in the repo for exactly this reason. If you copied
# without them: mkdir -p data web

services:
  scraper:
    build: .
    image: bca-forex:latest
    container_name: bca-forex-scraper
    restart: unless-stopped
    volumes:
      - ./data:/data     # the database — private
      - ./web:/web       # only the rendered chart goes here
    # Written as index.html so the bare host:port URL opens it. --pwa adds the
    # manifest, service worker and icons beside it.
    command: ["run", "--chart", "/web/index.html", "--pwa"]

  web:
    build: .
    image: bca-forex:latest
    container_name: bca-forex-web
    restart: unless-stopped
    depends_on:
      - scraper
    volumes:
      # Only /web, and read-only. The database is deliberately NOT mounted here:
      # a static file server would happily hand out the whole history file to
      # anyone on the LAN who guessed the name.
      - ./web:/web:ro
    ports:
      # host:container — change only the LEFT number to move the port. The right
      # one is inside the container and must stay 8080 to match the entrypoint
      # below. DSM itself uses 5000/5001, so avoid those.
      - "7000:8080"
    # --bind 0.0.0.0 is required: the default binds localhost inside the
    # container, which is unreachable from the NAS.
    entrypoint: ["python", "-m", "http.server", "8080",
                 "--directory", "/web", "--bind", "0.0.0.0"]

  # OPT-IN, and only if you do not already run a tunnel on this NAS.
  #
  # It sits behind a profile so it never starts by accident: with no token, a
  # cloudflared container would crash-loop forever against `restart:
  # unless-stopped`. Start it deliberately:
  #
  #     docker compose --profile tunnel up -d
  #
  # ALREADY HAVE A TUNNEL? Do not use this. One tunnel serves any number of
  # hostnames — add a public hostname to the existing one instead:
  #
  #     forex.<your-domain>  ->  HTTP  ->  <nas-lan-ip>:7000
  #
  # Point it at the NAS IP and the published port, NOT at `web:8080`. The
  # service name only resolves for containers on THIS compose network, and an
  # existing cloudflared lives in its own stack.
  #
  # Why a tunnel at all: cloudflared dials OUT to Cloudflare and traffic returns
  # down that connection, so the page gets a real certificate at a real hostname
  # with no inbound port open. HTTPS is not cosmetic — service workers only run
  # in a secure context, so offline does not work over plain http://nas-ip.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: bca-forex-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    depends_on:
      - web
    # No ports. That is the point.
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${TUNNEL_TOKEN:-}"]
